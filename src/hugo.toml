basepageref = 'https://mimvoid.neocities.org/'
baseURL = 'https://mimvoid.neocities.org/'
locale = 'en-us'

title = "mimvoid's little corner"
copyright = 'mimvoid © 2026'

uglyUrls = true  # allow .html extension
enableGitInfo = true  # let Git be used for the Lastmod param
summaryLength = 108

# Overwrite Hugo's default 404 page link
[[server.redirects]]
from = '/**'
status = 404
to = '/not_found.html'


[security]
enableInlineShortcodes = true

[frontmatter]
lastmod = ['lastmod', ':fileModTime', ':default']

[minify]
minifyOutput = true

[build]
noJSConfigInAssets = true  # don't generate a .jsconfig.json file when building


[markup.highlight]
style = 'rose-pine-moon'
tabWidth = 2

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser.attribute]
block = true
