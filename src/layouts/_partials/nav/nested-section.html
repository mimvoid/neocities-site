{{ with .context }}
<details class="nested"{{ if or (.IsAncestor $.currentSection) (.Eq $.currentSection) }} open{{ end }}>
  {{ partial "nav/summary" . }}
  <div class="details-content">
    {{ range .Sections }}
      {{ partialCached "nav/nested-section" (dict "context" . "currentSection" $.currentSection) }}
    {{ end }}
    {{ range .RegularPages }}
      <p>{{ partial "utils/link-page" . }}</p>
    {{ end }}
  </div>
</details>
{{ end }}
