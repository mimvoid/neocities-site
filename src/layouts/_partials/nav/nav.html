<nav class="box">
{{ range site.Sections }}
  <details{{ if or (.IsAncestor $) (.Eq $) }} open{{ end }}>
    {{ partial "nav/summary" . }}
    <div class="details-content">
      {{ range .Sections }}
        {{ partial "nav/nested-section" (dict "context" . "currentSection" $) }}
      {{ end }}
      {{ range .RegularPages }}
        <p>{{ partial "utils/link-page" . }}</p>
      {{ end }}
    </div>
  </details>
{{ end }}
</nav>
