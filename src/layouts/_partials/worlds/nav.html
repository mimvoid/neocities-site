{{- $world := site.GetPage .world -}}
<nav class="box">
  <details open>
    {{ partial "nav/summary" $world }}
    <div class="details-content">
      {{ range .Sections }}
        {{ partial "nav/nested-section" (dict "context" . "currentSection" $.currentSection) }}
      {{ end }}
      {{ range $world.RegularPages }}
        <p>{{ partial "utils/link-page" . }}</p>
      {{ end }}
    </div>
  </details>
</nav>
